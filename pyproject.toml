[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "who-am-i"
version = "0.1.0"
description = "Local-first daily self-knowledge for people who build with AI tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Who Am I contributors" }]
keywords = ["quantified-self", "ai-usage", "daily-report", "local-first", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
wai = "whoami.cli:app"

[project.urls]
Homepage = "https://github.com/Lniosy/who-am-i"
Issues = "https://github.com/Lniosy/who-am-i/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whoami = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
