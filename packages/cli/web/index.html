<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>Who Am I</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-solid: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60, 60, 67, 0.12);
      --fill: rgba(120, 120, 128, 0.12);
      --blue: #0071e3;
      --blue-press: #0077ed;
      --green: #248a3d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
      --radius: 18px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: rgba(28, 28, 30, 0.72);
        --surface-solid: #1c1c1e;
        --ink: #f5f5f7;
        --muted: #98989d;
        --line: rgba(84, 84, 88, 0.48);
        --fill: rgba(120, 120, 128, 0.24);
        --blue: #0a84ff;
        --green: #30d158;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -0.022em;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px 88px; }
    header.top {
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap;
      margin: 0 -22px 28px; padding: 14px 22px 12px;
      background: var(--surface);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .brand {
      font-size: 13px; font-weight: 590; color: var(--muted);
      letter-spacing: 0.02em;
    }
    h1 {
      font-size: 34px; font-weight: 700; margin: 2px 0 0;
      letter-spacing: -0.03em; line-height: 1.1;
    }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type=date], button {
      appearance: none; border: 0; cursor: pointer;
      background: var(--fill); color: var(--ink);
      border-radius: 980px; padding: 8px 14px;
      font-size: 13px; font-weight: 590; letter-spacing: -0.01em;
      transition: transform 100ms ease-out, opacity 100ms ease-out, background-color 160ms ease;
    }
    input[type=date] { padding: 7px 12px; }
    button:hover { background: rgba(120, 120, 128, 0.2); }
    button:active, input[type=date]:active { transform: scale(0.97); }
    button.active { background: var(--ink); color: var(--bg); }
    button.primary { background: var(--blue); color: #fff; }
    button.primary:hover { background: var(--blue-press); }
    button:disabled { opacity: .45; cursor: wait; }
    .seg {
      display: flex; padding: 2px; border-radius: 10px; background: var(--fill);
    }
    .seg button {
      border-radius: 8px; padding: 6px 12px; background: transparent;
    }
    .seg button.active {
      background: var(--surface-solid); color: var(--ink);
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    .banner {
      background: var(--fill); border-radius: 12px;
      padding: 11px 14px; font-size: 13px; color: var(--muted);
      margin-bottom: 18px; letter-spacing: 0;
    }
    .hero, .tool, .card {
      background: var(--surface-solid);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero { padding: 28px 28px 22px; margin-bottom: 16px; }
    .kicker {
      font-size: 12px; font-weight: 590; color: var(--muted);
      letter-spacing: 0.02em;
    }
    .hero h2 {
      font-size: 28px; font-weight: 700; margin: 8px 0 10px;
      letter-spacing: -0.025em; line-height: 1.15;
    }
    .meta { color: var(--muted); font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 0; }
    .stat {
      background: var(--fill); border-radius: 14px; padding: 14px 16px;
    }
    .stat b {
      display: block; font-size: 28px; font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.1;
    }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 510; letter-spacing: 0; }
    .tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 16px 0; }
    .tool { padding: 18px 18px 16px; }
    .tool-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
    .icon svg { width: 18px; height: 18px; }
    .tool h3 { margin: 0; font-size: 17px; font-weight: 590; letter-spacing: -0.022em; }
    .bar { height: 4px; background: var(--fill); border-radius: 99px; overflow: hidden; margin: 8px 0; }
    .bar > i { display: block; height: 100%; border-radius: 99px; }
    .nums { display: flex; gap: 14px; font-size: 13px; color: var(--muted); letter-spacing: 0; }
    .cols { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; }
    .card { padding: 22px 22px 18px; }
    .card h3 {
      margin: 0 0 14px; font-size: 13px; font-weight: 590;
      color: var(--muted); letter-spacing: 0.01em;
    }
    .card h3 + h3 { margin-top: 22px; }
    ul { margin: 0; padding: 0; list-style: none; }
    li {
      margin: 0; padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px; letter-spacing: -0.016em;
    }
    li:last-child { border-bottom: 0; }
    .timeline { display: flex; flex-direction: column; }
    .row {
      display: grid; grid-template-columns: 56px 1fr auto; gap: 10px;
      align-items: center; font-size: 15px;
      padding: 10px 0; border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .align { font-size: 21px; font-weight: 590; letter-spacing: -0.022em; line-height: 1.3; margin: 0 0 10px; }
    .effort { color: var(--green); margin: 0 0 8px; font-size: 15px; }
    footer {
      margin-top: 36px; color: var(--muted);
      font-size: 12px; letter-spacing: 0; line-height: 1.5;
    }
    @media (prefers-reduced-transparency: reduce) {
      header.top { background: var(--surface-solid); backdrop-filter: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      button, input[type=date] { transition: none; }
    }
    @media (max-width: 860px) {
      .grid, .tools, .cols { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      h1 { font-size: 28px; }
      .hero h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="brand">Who Am I</div>
        <h1>今天的自己</h1>
      </div>
      <div class="controls">
        <input type="date" id="date" />
        <button id="scanBtn" class="primary" type="button">生成本机日报</button>
        <div class="seg">
          <button id="liveBtn" type="button" class="active">本机</button>
          <button id="demoBtn" type="button">示例</button>
        </div>
      </div>
    </header>
    <div id="banner" class="banner">正在读取本机数据。</div>
    <section class="hero">
      <div class="kicker" id="kicker">日报</div>
      <h2 id="headline">…</h2>
      <div class="meta" id="meta"></div>
      <div class="grid">
        <div class="stat"><b id="sHours">—</b><span>有痕迹的时长</span></div>
        <div class="stat"><b id="sSessions">—</b><span>AI 会话</span></div>
        <div class="stat"><b id="sTokens">—</b><span>Tokens</span></div>
        <div class="stat"><b id="sCommits">—</b><span>Git 提交</span></div>
      </div>
    </section>
    <section class="tools" id="tools"></section>
    <section class="cols">
      <div class="card">
        <h3>今天的时间</h3>
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="card">
        <h3>今天做完了什么</h3>
        <ul id="finished"></ul>
        <h3>留下的痕迹</h3>
        <ul id="traces"></ul>
        <h3>不必担心什么</h3>
        <ul id="worry"></ul>
        <h3>明天先做什么</h3>
        <ul id="tomorrow"></ul>
      </div>
    </section>
    <section class="cols" style="margin-top:12px">
      <div class="card">
        <h3>和我想要的东西对齐吗</h3>
        <p class="align" id="alignment"></p>
        <p class="effort" id="effort"></p>
        <p id="star" style="color:var(--muted); margin:0; font-size:15px"></p>
      </div>
      <div class="card">
        <h3>Git</h3>
        <div id="git"></div>
      </div>
    </section>
    <footer>数据默认留在本机。示例日用来展示面板，不是你的隐私。时长按会话时间戳聚类，并行时段只计一次。</footer>
  </div>
  <script>
    const ICONS = {
      "claude-code": `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.1 6.2L21 12l-6.9 2.8L12 21l-2.1-6.2L3 12l6.9-2.8L12 3z" fill="#fff"/></svg>`,
      cursor: `<svg viewBox="0 0 24 24" fill="none"><path d="M5 4l14 8-6.2 1.6L11 21 5 4z" fill="#fff"/></svg>`,
      codex: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg>`,
      "grok-build": `<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.8 5.7 20.8 8 13.6 2 9.2h7.6L12 2z" fill="#fff"/></svg>`,
      git: `<svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="7" r="2.2" fill="#fff"/><circle cx="17" cy="7" r="2.2" fill="#fff"/><circle cx="12" cy="17" r="2.2" fill="#fff"/><path d="M7 9v3c0 2 2 4 5 4" stroke="#fff" stroke-width="1.6"/><path d="M17 9v3" stroke="#fff" stroke-width="1.6"/></svg>`
    };

    let mode = "live";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function fmtTokens(n) {
      if (!n) return "—";
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
      return String(n);
    }
    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }
    function list(el, items) {
      el.innerHTML = (items || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>暂无</li>";
    }

    function render(data) {
      const report = data.report || {};
      const empty = data.empty && !data.demo;
      document.getElementById("headline").textContent = empty
        ? "这一天还没有本机日报"
        : (report.headline || "今天很安静");
      document.getElementById("kicker").textContent = data.demo ? "示例日报" : "本机日报";
      if (data.date) document.getElementById("date").value = data.date;
      document.getElementById("sHours").textContent = ((data.totals && data.totals.hours) || 0).toFixed(1) + "h";
      document.getElementById("sSessions").textContent = (data.totals && data.totals.sessions) || 0;
      document.getElementById("sTokens").textContent = fmtTokens(data.totals && data.totals.tokens);
      document.getElementById("sCommits").textContent = (data.totals && data.totals.commits) || 0;
      document.getElementById("meta").textContent =
        (data.identity && data.identity.name ? data.identity.name + " · " : "") + (data.date || "");
      const tools = data.tools || [];
      const maxH = Math.max(...tools.map((t) => t.hours), 0.1);
      document.getElementById("tools").innerHTML = tools.map((t) => `
        <article class="tool">
          <div class="tool-head">
            <div class="icon" style="background:${esc(t.accent)}">${ICONS[t.id] || ICONS.git}</div>
            <div>
              <h3>${esc(t.label)}</h3>
              <div class="nums">${t.sessions} 会话 · ${esc((t.titles || [])[0] || "")}</div>
            </div>
          </div>
          <div class="bar"><i style="width:${Math.max(8, t.hours / maxH * 100)}%;background:${esc(t.accent)}"></i></div>
          <div class="nums"><span>${Number(t.hours).toFixed(1)} 小时</span><span>${fmtTokens(t.tokens)} tokens</span></div>
        </article>`).join("");
      document.getElementById("timeline").innerHTML = (data.timeline || []).map((r) => `
        <div class="row">
          <time>${esc(fmtTime(r.start))}</time>
          <div><span class="dot" style="background:${esc(r.accent)}"></span>${esc(r.label)} · ${esc(r.title)}</div>
          <div>${Number(r.hours).toFixed(1)}h</div>
        </div>`).join("") || "<div class='row'>还没有时间窗</div>";
      list(document.getElementById("finished"), report.finished);
      list(document.getElementById("traces"), report.traces);
      list(document.getElementById("worry"), report.do_not_worry);
      list(document.getElementById("tomorrow"), report.tomorrow);
      document.getElementById("alignment").textContent = report.alignment || "";
      document.getElementById("effort").textContent = report.effort_note || "";
      document.getElementById("star").textContent = (data.identity && data.identity.north_star) || "";
      document.getElementById("git").innerHTML = (data.git || []).map((g) =>
        `<p style="margin:0 0 8px"><b>${esc(g.repo)}</b> · ${g.commits} 次提交 · +${g.insertions} / −${g.deletions}</p>
         <ul>${(g.messages || []).map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`
      ).join("") || "<p style='margin:0;color:var(--muted)'>今天没有提交。</p>";
      const banner = document.getElementById("banner");
      const errors = (data.collector_errors || []).map((e) => e.tool + "：" + e.message).join("；");
      if (data.demo) {
        banner.style.display = "block";
        banner.textContent = "这是写进产品里的示例日。点「本机」或「生成本机日报」看你自己的一天。";
      } else if (empty) {
        banner.style.display = "block";
        banner.textContent = (data.requested || data.date) + " 还没有日报。点「生成本机日报」采集并写一份。";
      } else if (errors) {
        banner.style.display = "block";
        banner.textContent = "部分采集器有警告：" + errors;
      } else {
        banner.style.display = "none";
      }
    }

    async function load() {
      const date = document.getElementById("date").value;
      try {
        if (mode === "demo") {
          render(await (await fetch("/api/demo")).json());
          return;
        }
        const res = await fetch("/api/day?date=" + encodeURIComponent(date || ""));
        render(await res.json());
      } catch (err) {
        document.getElementById("banner").style.display = "block";
        document.getElementById("banner").textContent = "读不到本机服务。先运行 wai serve 或从桌面窗口打开。";
      }
    }

    async function generate() {
      const btn = document.getElementById("scanBtn");
      btn.disabled = true;
      btn.textContent = "正在采集…";
      mode = "live";
      document.getElementById("liveBtn").classList.add("active");
      document.getElementById("demoBtn").classList.remove("active");
      const date = document.getElementById("date").value;
      try {
        const res = await fetch("/api/today?date=" + encodeURIComponent(date || ""), { method: "POST" });
        render(await res.json());
      } catch {
        document.getElementById("banner").style.display = "block";
        document.getElementById("banner").textContent = "生成失败。看终端里 wai serve 的输出。";
      } finally {
        btn.disabled = false;
        btn.textContent = "生成本机日报";
      }
    }

    document.getElementById("demoBtn").onclick = () => {
      mode = "demo";
      document.getElementById("demoBtn").classList.add("active");
      document.getElementById("liveBtn").classList.remove("active");
      load();
    };
    document.getElementById("liveBtn").onclick = () => {
      mode = "live";
      document.getElementById("liveBtn").classList.add("active");
      document.getElementById("demoBtn").classList.remove("active");
      load();
    };
    document.getElementById("date").onchange = () => {
      mode = "live";
      document.getElementById("liveBtn").classList.add("active");
      document.getElementById("demoBtn").classList.remove("active");
      load();
    };
    document.getElementById("scanBtn").onclick = generate;
    load();
  </script>
</body>
</html>
