<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Who Am I · 日报</title>
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #fffaf3;
      --ink: #1c1915;
      --muted: #6f675c;
      --line: #e6ddd0;
      --good: #3c6e50;
      --warm: #c45c26;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif; }
    a { color: inherit; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 80px; }
    header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .brand { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: 34px; font-weight: 600; margin: 4px 0 0; letter-spacing: -.02em; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, select, input[type=date] {
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      border-radius: 999px; padding: 8px 14px; font: 14px/1 ui-sans-serif, system-ui, sans-serif;
    }
    button.active { background: var(--ink); color: var(--paper); }
    .banner {
      background: #efe4d2; border: 1px dashed #d3c3a8; border-radius: 14px;
      padding: 10px 14px; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      color: var(--muted); margin-bottom: 18px;
    }
    .hero {
      background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
      padding: 28px; margin-bottom: 18px;
    }
    .hero .kicker { font: 12px ui-sans-serif, system-ui; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .hero h2 { font-size: 28px; margin: 8px 0 12px; }
    .meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font: 14px ui-sans-serif, system-ui; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 8px; }
    .stat { background: #f7f1e7; border-radius: 14px; padding: 14px 16px; }
    .stat b { display: block; font-size: 22px; font-family: ui-sans-serif, system-ui; }
    .stat span { color: var(--muted); font: 12px ui-sans-serif, system-ui; }
    .tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 18px 0; }
    .tool {
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px;
    }
    .tool-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
    .icon svg { width: 20px; height: 20px; }
    .tool h3 { margin: 0; font-size: 17px; }
    .bar { height: 8px; background: #efe6d8; border-radius: 99px; overflow: hidden; margin: 8px 0; }
    .bar > i { display: block; height: 100%; border-radius: 99px; }
    .nums { display: flex; gap: 14px; font: 13px ui-sans-serif, system-ui; color: var(--muted); }
    .cols { display: grid; grid-template-columns: 1.2fr .8fr; gap: 12px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
    .card h3 { margin: 0 0 12px; font-size: 16px; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 6px 0; }
    .timeline { display: flex; flex-direction: column; gap: 10px; }
    .row { display: grid; grid-template-columns: 88px 1fr auto; gap: 10px; align-items: center; font: 13px ui-sans-serif, system-ui; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .align { font-size: 17px; }
    .effort { color: var(--good); }
    footer { margin-top: 28px; color: var(--muted); font: 12px ui-sans-serif, system-ui; }
    @media (max-width: 860px) {
      .grid, .tools, .cols { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="brand">Who Am I</div>
        <h1>今天的自己</h1>
      </div>
      <div class="controls">
        <input type="date" id="date" />
        <button id="liveBtn" type="button">本机数据</button>
        <button id="demoBtn" type="button" class="active">示例日</button>
      </div>
    </header>
    <div id="banner" class="banner">正在打开示例日，让你先看到成品长什么样。</div>
    <section class="hero">
      <div class="kicker" id="kicker">日报</div>
      <h2 id="headline">…</h2>
      <div class="meta" id="meta"></div>
      <div class="grid">
        <div class="stat"><b id="sHours">—</b><span>工作时长</span></div>
        <div class="stat"><b id="sSessions">—</b><span>AI 会话</span></div>
        <div class="stat"><b id="sTokens">—</b><span>Tokens</span></div>
        <div class="stat"><b id="sCommits">—</b><span>Git 提交</span></div>
      </div>
    </section>
    <section class="tools" id="tools"></section>
    <section class="cols">
      <div class="card">
        <h3>今天的时间</h3>
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="card">
        <h3>今天做完了什么</h3>
        <ul id="finished"></ul>
        <h3 style="margin-top:18px">不必担心什么</h3>
        <ul id="worry"></ul>
        <h3 style="margin-top:18px">明天先做什么</h3>
        <ul id="tomorrow"></ul>
      </div>
    </section>
    <section class="cols" style="margin-top:12px">
      <div class="card">
        <h3>和我想要的东西对齐吗</h3>
        <p class="align" id="alignment"></p>
        <p class="effort" id="effort"></p>
        <p id="star" style="color:var(--muted)"></p>
      </div>
      <div class="card">
        <h3>Git</h3>
        <div id="git"></div>
      </div>
    </section>
    <footer>数据默认留在本机。示例日是写进页面里的样例，用来展示面板，不是你的隐私。</footer>
  </div>
  <script>
    const ICONS = {
      "claude-code": `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.1 6.2L21 12l-6.9 2.8L12 21l-2.1-6.2L3 12l6.9-2.8L12 3z" fill="#fff"/></svg>`,
      cursor: `<svg viewBox="0 0 24 24" fill="none"><path d="M5 4l14 8-6.2 1.6L11 21 5 4z" fill="#fff"/></svg>`,
      codex: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg>`,
      "grok-build": `<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.8 5.7 20.8 8 13.6 2 9.2h7.6L12 2z" fill="#fff"/></svg>`,
      git: `<svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="7" r="2.2" fill="#fff"/><circle cx="17" cy="7" r="2.2" fill="#fff"/><circle cx="12" cy="17" r="2.2" fill="#fff"/><path d="M7 9v3c0 2 2 4 5 4" stroke="#fff" stroke-width="1.6"/><path d="M17 9v3" stroke="#fff" stroke-width="1.6"/></svg>`
    };

    const DEMO = {
      demo: true,
      date: "2026-08-27",
      identity: { name: "示例", north_star: "每天结束时，清楚自己做了什么、没做什么、明天先做什么。", goals: ["做出 Who Am I 的可用 MVP"] },
      report: {
        headline: "把采集器和晚间日报接到一起了",
        finished: ["Claude Code 里写完本机采集器骨架", "Cursor 里把日报五段结构定下来", "仓库 who-am-i 提交 6 次"],
        do_not_worry: ["Cursor 官方用量 API 还不稳，先读本地会话就够", "全盘软件监控不是这一周的事"],
        tomorrow: ["把日报页做成晚上愿意打开的样子", "补一条周报"],
        alignment: "今天的痕迹和「做出可用 MVP」是同向的。",
        effort_note: "有留下证据的努力：会话、提交、一份能读的日报。"
      },
      tools: [
        { id: "claude-code", label: "Claude Code", accent: "#D97757", sessions: 2, hours: 3.4, tokens: 1842300, titles: ["写采集器"] },
        { id: "cursor", label: "Cursor", accent: "#8888FF", sessions: 2, hours: 2.1, tokens: 0, titles: ["日报五段结构"] },
        { id: "grok-build", label: "Grok Build", accent: "#1F1F1F", sessions: 1, hours: 1.2, tokens: 640120, titles: ["定位产品差异"] },
        { id: "codex", label: "Codex", accent: "#10A37F", sessions: 1, hours: 0.6, tokens: 188440, titles: ["补测试"] }
      ],
      timeline: [
        { tool: "claude-code", label: "Claude Code", accent: "#D97757", title: "写采集器", start: "2026-08-27T09:40:00", hours: 2.5 },
        { tool: "grok-build", label: "Grok Build", accent: "#1F1F1F", title: "定位产品差异", start: "2026-08-27T13:00:00", hours: 1.2 },
        { tool: "cursor", label: "Cursor", accent: "#8888FF", title: "日报五段结构", start: "2026-08-27T14:30:00", hours: 1.8 },
        { tool: "codex", label: "Codex", accent: "#10A37F", title: "补测试", start: "2026-08-27T16:40:00", hours: 0.6 }
      ],
      git: [{ repo: "who-am-i", commits: 6, insertions: 1480, deletions: 90, messages: ["init collectors", "add daily report schema"] }],
      totals: { sessions: 6, hours: 7.3, tokens: 2670860, commits: 6 }
    };

    let mode = "demo";

    function fmtTokens(n) {
      if (!n) return "—";
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
      return String(n);
    }
    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }
    function list(el, items) {
      el.innerHTML = (items || []).map((x) => `<li>${x}</li>`).join("") || "<li>暂无</li>";
    }

    function render(data) {
      const report = data.report || {};
      document.getElementById("headline").textContent = report.headline || "今天很安静";
      document.getElementById("kicker").textContent = data.demo ? "示例日报" : "本机日报";
      document.getElementById("date").value = data.date;
      document.getElementById("sHours").textContent = (data.totals.hours || 0).toFixed(1) + "h";
      document.getElementById("sSessions").textContent = data.totals.sessions;
      document.getElementById("sTokens").textContent = fmtTokens(data.totals.tokens);
      document.getElementById("sCommits").textContent = data.totals.commits;
      document.getElementById("meta").textContent =
        (data.identity && data.identity.name ? data.identity.name + " · " : "") + data.date;
      const maxH = Math.max(...data.tools.map((t) => t.hours), 0.1);
      document.getElementById("tools").innerHTML = data.tools.map((t) => `
        <article class="tool">
          <div class="tool-head">
            <div class="icon" style="background:${t.accent}">${ICONS[t.id] || ICONS.git}</div>
            <div>
              <h3>${t.label}</h3>
              <div class="nums">${t.sessions} 会话 · ${(t.titles || [])[0] || ""}</div>
            </div>
          </div>
          <div class="bar"><i style="width:${Math.max(8, t.hours / maxH * 100)}%;background:${t.accent}"></i></div>
          <div class="nums"><span>${t.hours.toFixed(1)} 小时</span><span>${fmtTokens(t.tokens)} tokens</span></div>
        </article>`).join("");
      document.getElementById("timeline").innerHTML = data.timeline.map((r) => `
        <div class="row">
          <div>${fmtTime(r.start)}</div>
          <div><span class="dot" style="background:${r.accent}"></span>${r.label} · ${r.title}</div>
          <div>${r.hours.toFixed(1)}h</div>
        </div>`).join("") || "还没有时间窗";
      list(document.getElementById("finished"), report.finished);
      list(document.getElementById("worry"), report.do_not_worry);
      list(document.getElementById("tomorrow"), report.tomorrow);
      document.getElementById("alignment").textContent = report.alignment || "";
      document.getElementById("effort").textContent = report.effort_note || "";
      document.getElementById("star").textContent = (data.identity && data.identity.north_star) || "";
      document.getElementById("git").innerHTML = (data.git || []).map((g) =>
        `<p><b>${g.repo}</b> · ${g.commits} 次提交 · +${g.insertions} / −${g.deletions}</p>
         <ul>${(g.messages || []).map((m) => `<li>${m}</li>`).join("")}</ul>`
      ).join("") || "<p>今天没有提交。</p>";
      const banner = document.getElementById("banner");
      if (data.demo || data.fallback) {
        banner.style.display = "block";
        banner.textContent = data.fallback
          ? `${data.requested} 还没有本机日报，先显示示例日。跑一遍 wai today 再点「本机数据」。`
          : "这是写进产品里的示例日，用来展示面板。点「本机数据」读取你自己的一天。";
      } else {
        banner.style.display = "none";
      }
    }

    async function load() {
      const date = document.getElementById("date").value;
      if (mode === "demo") {
        try {
          const res = await fetch("/api/demo");
          render(await res.json());
        } catch {
          render(DEMO);
        }
        return;
      }
      try {
        const res = await fetch("/api/day?date=" + encodeURIComponent(date));
        render(await res.json());
      } catch {
        render(DEMO);
      }
    }

    document.getElementById("demoBtn").onclick = () => {
      mode = "demo";
      document.getElementById("demoBtn").classList.add("active");
      document.getElementById("liveBtn").classList.remove("active");
      load();
    };
    document.getElementById("liveBtn").onclick = () => {
      mode = "live";
      document.getElementById("liveBtn").classList.add("active");
      document.getElementById("demoBtn").classList.remove("active");
      load();
    };
    document.getElementById("date").onchange = () => {
      mode = "live";
      document.getElementById("liveBtn").classList.add("active");
      document.getElementById("demoBtn").classList.remove("active");
      load();
    };
    render(DEMO);
    load();
  </script>
</body>
</html>
